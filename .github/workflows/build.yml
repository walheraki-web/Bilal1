name: Build Bilal APK

# يبني ملف APK في سحابة GitHub عند كل رفع، أو يدويًا من تبويب Actions.
on:
  push:
    branches: [ main, master ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      # عدّاء ubuntu-latest يأتي بـ Android SDK مثبّتًا مسبقًا؛ نقبل التراخيص فقط.
      - name: Accept Android SDK licenses
        run: yes | "$ANDROID_SDK_ROOT/cmdline-tools/latest/bin/sdkmanager" --licenses >/dev/null 2>&1 || true

      - name: Build release APK
        run: ./gradlew :app:assembleRelease --no-daemon --stacktrace

      - name: Run sync-engine tests
        run: ./gradlew :app:testReleaseUnitTest --no-daemon

      - name: Upload APK (artifact)
        uses: actions/upload-artifact@v4
        with:
          name: bilal-apk
          path: app/build/outputs/apk/release/*.apk
          if-no-files-found: error

      # ينشر الـ APK في إصدار «latest» برابط تحميل مباشر ثابت.
      - name: Publish APK to the "latest" release
        if: github.ref == 'refs/heads/main'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          cp app/build/outputs/apk/release/*.apk bilal.apk
          gh release delete latest --repo "$GITHUB_REPOSITORY" --yes --cleanup-tag || true
          gh release create latest bilal.apk \
            --repo "$GITHUB_REPOSITORY" \
            --title "Bilal (آخر نسخة)" \
            --notes "رابط تحميل مباشر لأحدث APK. يُحدَّث تلقائيًا مع كل بناء."

permissions:
  contents: write
